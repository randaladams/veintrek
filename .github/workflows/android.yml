name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Install Godot and Android templates
        run: |
          cd ~/godot-dl
          unzip -o -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -o -q templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tdir/"
          ls -la "$tdir"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/veintrek-debug.keystore"
            echo "Using the repository's saved debug keystore."
          else
            keytool -genkeypair -v -keystore "$HOME/veintrek-debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret set; signed with a fresh key, so this APK can't update a previous install."
          fi

      - name: Configure Godot editor settings
        run: |
          mm=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${mm}.tres"; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/veintrek-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
            sed -i 's/^          //' ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.tres

      - name: Stamp version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg

      - name: Import project
        run: godot --headless --import 2>&1 | tail -20

      - name: Input self-test (right side fires, left side shocks, pause works, sensors on)
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 180 \
            godot --rendering-driver opengl3 --resolution 1280x720 -- --selftest 2>&1 | tee selftest.log | grep selftest
          grep -q "RESULT: PASS" selftest.log

      - name: Export APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/veintrek-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build
          godot --headless --export-debug "Android" build/veintrek.apk 2>&1 | tee export.log
          test -s build/veintrek.apk || { echo "::error::Export failed, no APK produced"; exit 1; }
          ls -la build/

      - uses: actions/upload-artifact@v4
        with:
          name: veintrek-apk
          path: build/veintrek.apk

      - name: Publish to the "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag -y 2>/dev/null || true
          gh release create latest-build build/veintrek.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build #${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. On your phone, download veintrek.apk and open it to install (allow installs from your browser if asked)." \
            --latest
